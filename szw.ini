[Rainmeter]
Update=1000
DynamicWindowSize=1
AccurateText=1
Codepage=936

[Metadata]
Name=晴雨表
Author=Weather Monitor
Information=显示深圳实时天气和未来3天预报

[Variables]
@include=#CURRENTPATH#data\weather_vars.inc
@include2=#CURRENTPATH#data\rain.inc

; 外观配置
BgAlpha=150
BgColor=0,0,0,#BgAlpha#
TextColor=255,255,255,240
DimColor=255,255,255,180
TitleColor=255,255,255,255

; =============== 核心：计时器（规避循环 + 5分钟定期刷新） ===============
[MeasureRefreshTimer]
Measure=Calc
; 关键公式：用户给出的修改方案：(Counter + 1) % 301
; 逻辑：Counter=0（!Refresh后）→ (0+1)%301=1≠0 → 不触发；Counter=300（5分钟）→ (300+1)%301=0 → 触发
Formula=(Counter + 1) % 301  
IfEqualValue=0  ; 仅当计算结果为0时触发刷新
IfEqualAction=["#CURRENTPATH#python32\pythonw.exe" "#CURRENTPATH#update_weather.pyw"]["#CURRENTPATH#python32\pythonw.exe" "#CURRENTPATH#getrain.pyw"][!Delay 7000][!Refresh]
DynamicVariables=1
UpdateDivider=1  ; 每秒更新一次计时器

